<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />

    <title>Mikael's CLI Dashboard</title>

    <link rel="icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css?v=kanban_v1">
</head>
<body>

    <div class="container">
        
        <!-- Minimalist Header & Command Bar -->
        <header class="header-section">
            <div class="top-bar">
                <span class="system-status"><span class="status-dot"></span> MIKAEL // STARTPAGE</span>
                <span id="greeting" class="greeting-text"></span>
            </div>

            <!-- Spotlight Command Bar -->
            <div class="command-bar-wrapper">
                <span class="prompt-symbol">&gt;_</span>
                <input 
                    type="text" 
                    id="command-input" 
                    placeholder="Type to filter, or 'g', 'yt', 'r' to search... (Press '/' to focus)" 
                    autocomplete="off" 
                    spellcheck="false" 
                    autofocus 
                />
                <span class="shortcut-hint">CTRL+K</span>
            </div>
        </header>

        <!-- Minimalist Kanban Lanes -->
        <main class="kanban-grid" id="kanban-grid">
            <div class="kanban-lane" id="box-social">
                <div class="lane-header"><span class="tag tag-social">●</span> SOCIAL</div>
                <ul></ul>
            </div>

            <div class="kanban-lane" id="box-fun">
                <div class="lane-header"><span class="tag tag-fun">●</span> FUN</div>
                <ul></ul>
            </div>

            <div class="kanban-lane" id="box-web-apps">
                <div class="lane-header"><span class="tag tag-apps">●</span> WEB-APPS</div>
                <ul></ul>
            </div>

            <div class="kanban-lane" id="box-finances">
                <div class="lane-header"><span class="tag tag-finances">●</span> FINANCES</div>
                <ul></ul>
            </div>

            <div class="kanban-lane" id="box-other">
                <div class="lane-header"><span class="tag tag-other">●</span> OTHER</div>
                <ul></ul>
            </div>
        </main>

        <!-- Footer Landmark -->
        <footer class="footer">
            <a href="https://github.com/miklam/startpage" target="_blank" rel="noopener noreferrer">github repo</a>
        </footer>
    </div>

    <script src="config.js"></script>
    <script src="main.js?v=kanban_v1"></script>
</body>
</html>
